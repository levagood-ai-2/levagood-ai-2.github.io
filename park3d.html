<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Levagood Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<meta name="description" content="Levagood Park as a game: run the deck, swim, find the stars, and look inside how Ari the beagle thinks. A park for learning how AI agents work.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 56S6 40 6 22a13 13 0 0 1 26-4 13 13 0 0 1 26 4c0 18-26 34-26 34z' fill='%23FF2E88'/%3E%3C/svg%3E">
<style>
  :root{--ink:#1b1d24;--mute:#5b6170;--pink:#FF2E88;--cyan:#22d3ee;--card:rgba(255,255,255,.93);--font:"Nunito","Inter Tight",system-ui,-apple-system,sans-serif}
  *{box-sizing:border-box}

  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(20,30,50,.22) 100%)}
  .bar{position:fixed;top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:center;z-index:5;pointer-events:none}
  .who{position:fixed;top:66px;right:14px;z-index:6;display:none;flex-direction:column;gap:6px;padding:12px;background:rgba(255,255,255,.96);border-radius:18px;box-shadow:0 8px 30px rgba(20,30,40,.18);font-family:Nunito,Inter Tight,system-ui,sans-serif;min-width:180px}
  .who.on{display:flex}.who b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#5b6170;padding:0 4px 2px}.who button{border:0;border-radius:12px;padding:10px 12px;font:inherit;font-weight:800;font-size:15px;text-align:left;background:#f1f3f6;color:#1b1d24;cursor:pointer}.who button:hover{background:#e4e8ee}.who button.on{background:#1b1d24;color:#fff}.who small{color:#5b6170;font-size:12px;padding:4px 4px 0;max-width:220px}
  .bar>*{pointer-events:auto}
  .pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--card);box-shadow:0 6px 24px rgba(20,30,50,.14),inset 0 0 0 1px rgba(255,255,255,.6);font:800 15px/1 var(--font);color:var(--ink);text-decoration:none;border:0;cursor:pointer}
  .pill.ink{background:rgba(27,29,36,.86);color:#fff}
  .pill[aria-pressed="true"]{background:var(--pink);color:#fff}
  .pill:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
  .logo svg{display:block}
  .spacer{flex:1}
  .hud{display:none;gap:14px;align-items:center;font:800 15px/1 var(--font)}
  body.walking .hud{display:inline-flex}
  .hud b{color:var(--pink);margin-right:2px}
  .hud i{font-style:normal;color:var(--mute);font-weight:700}
  body.walking #look-btn,body.walking #walk{display:none}
  .where{position:fixed;right:14px;bottom:14px;z-index:5;padding:8px 14px;border-radius:999px;background:var(--card);font:800 12px/1.2 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:none}
  body.walking .where{display:block}
  body.panel-open .where,body.panel-open .hint{display:none}
  .prompt{position:fixed;left:50%;bottom:112px;transform:translateX(-50%) translateY(6px);padding:10px 16px;border-radius:999px;background:rgba(27,29,36,.86);color:#fff;font:800 15px/1 var(--font);z-index:5;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;white-space:nowrap}
  .prompt.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .prompt kbd{display:inline-block;min-width:26px;padding:4px 7px;border-radius:7px;background:#fff;color:var(--ink);font:800 13px/1 var(--font);text-align:center;margin-right:6px}
  .hint{position:fixed;left:50%;top:84px;transform:translateX(-50%) translateY(-6px);padding:12px 18px;border-radius:999px;background:var(--card);box-shadow:0 6px 24px rgba(20,30,50,.14);font:800 16px/1.2 var(--font);z-index:6;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:min(560px,calc(100vw - 28px));text-align:center}
  .hint.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .talk{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);width:min(520px,calc(100vw - 28px));background:var(--card);border-radius:18px;box-shadow:0 10px 36px rgba(20,30,50,.18);padding:14px 18px;z-index:6;display:none;font:700 16px/1.45 var(--font)}
  .talk.on{display:block}
  .talk b{display:block;color:var(--pink);font-weight:900;margin-bottom:2px;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
  .toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--ink);color:#fff;font:800 17px/1.3 var(--font);padding:12px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(20,30,50,.25);z-index:8;animation:toast 3.2s forwards;pointer-events:none;max-width:min(640px,calc(100vw - 28px));text-align:center}
  .toast.find{background:var(--pink)}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
  #stick{position:fixed;left:22px;bottom:22px;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);z-index:6;display:none;touch-action:none}
  #stick i{position:absolute;left:38px;top:38px;width:56px;height:56px;border-radius:50%;background:rgba(27,29,36,.6)}
  body.walking.touch #stick{display:block}
  .tbtn{position:fixed;z-index:6;display:none;border:0;border-radius:50%;color:#fff;font:900 16px var(--font);box-shadow:0 8px 24px rgba(20,30,50,.2);touch-action:none}
  #jump-btn{right:22px;bottom:26px;width:92px;height:92px;background:var(--pink)}
  #run-btn{right:124px;bottom:22px;width:68px;height:68px;background:rgba(27,29,36,.8)}
  #run-btn.held{background:var(--cyan);color:var(--ink)}
  body.walking.touch .tbtn{display:block}
  #talk-btn{position:fixed;right:22px;bottom:134px;z-index:6;display:none}
  body.walking.touch #talk-btn.on{display:inline-flex}
  body.walking.touch .where{display:none}
  body.walking.touch .prompt{display:none}
  .gate{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,10,10,.45);padding:16px}
  .gate.on{display:flex}
  .gate-card{width:min(420px,100%);background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:24px}
  .gate-card h2{margin:0 0 8px;font:900 22px/1.15 var(--font)}
  .gate-card p{margin:0 0 16px;font:600 15px/1.5 var(--font)}
  .gate-row{display:flex;gap:10px;flex-wrap:wrap}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;background:#9fd3f0;font:800 18px/1 var(--font);transition:opacity .4s}
  .loading.done{opacity:0;pointer-events:none}
  /* inside Ari */
  .inside{position:fixed;top:72px;right:14px;bottom:14px;width:min(380px,calc(100vw - 28px));background:var(--card);border-radius:22px;box-shadow:0 14px 48px rgba(20,30,50,.2);z-index:7;display:none;flex-direction:column;overflow:hidden;font:700 14px/1.4 var(--font)}
  .inside.on{display:flex}
  .inside header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
  .inside header b{font:900 20px/1 var(--font)}
  .inside header button{border:0;background:rgba(27,29,36,.08);width:36px;height:36px;border-radius:50%;font:900 16px var(--font);cursor:pointer}
  .inside .scroll{overflow:auto;padding:0 16px 16px;flex:1}
  .inside h4{margin:12px 0 6px;font:900 12px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
  .inside ul,.inside ol{margin:0;padding:0;list-style:none}
  .inside #in-senses li{padding:6px 0;border-bottom:1px solid rgba(27,29,36,.07)}
  .inside #in-senses li b{color:var(--cyan);filter:saturate(1.2) brightness(.75);font-weight:900}
  .inside #in-senses li span{display:block;color:var(--mute);font-weight:600;font-size:13px}
  .inside #in-senses li.mem b{color:#a855f7}
  .inside #in-senses li.dim{color:var(--mute)}
  .inside .small{color:var(--mute);font-weight:600;font-size:12px}
  .want{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;margin:5px 0}
  .want em{font-style:normal;font-weight:800}
  .want div{height:12px;border-radius:999px;background:rgba(27,29,36,.08);overflow:hidden}
  .want div i{display:block;height:100%;border-radius:999px;background:var(--pink);transition:width .25s}
  .want.play div i{background:#22d3ee}.want.rest div i{background:#a855f7}.want.sniff div i{background:#84cc16}
  #in-goal{padding:10px 12px;border-radius:12px;background:rgba(255,46,136,.08);margin-bottom:6px}
  #in-goal b{display:block;font-size:15px}#in-goal span{color:var(--mute);font-weight:600;font-size:13px}
  #in-steps li{padding:4px 0 4px 22px;position:relative;color:var(--mute)}
  #in-steps li::before{content:"";position:absolute;left:4px;top:11px;width:9px;height:9px;border-radius:50%;background:rgba(27,29,36,.2)}
  #in-steps li.now{color:var(--ink);font-weight:900}#in-steps li.now::before{background:var(--pink);box-shadow:0 0 0 4px rgba(255,46,136,.2)}
  #in-steps li.done{text-decoration:line-through;opacity:.55}
  #in-opts li{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px;color:var(--mute)}
  #in-opts li span{flex:0 0 150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #in-opts li i{display:block;height:8px;border-radius:999px;background:rgba(27,29,36,.25);transition:width .3s}
  #in-opts li:first-child{color:var(--ink);font-weight:800}#in-opts li:first-child i{background:var(--pink)}
  .tink{margin-top:8px;padding:12px;border-radius:14px;background:rgba(34,211,238,.1)}
  .tink label{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:6px 0;font-weight:800}
  .tink input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--pink)}
  .tink input[type=checkbox]{width:22px;height:22px;accent-color:var(--pink)}
  #in-note{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:rgba(27,29,36,.06);font-weight:700;color:var(--ink)}
  .chat{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100vw - 28px));max-height:min(62vh,520px);background:var(--card);border-radius:22px;box-shadow:0 14px 48px rgba(20,30,50,.2);z-index:7;display:none;flex-direction:column;overflow:hidden;font:700 15px/1.4 var(--font)}

  .chat header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px}
  .chat header b{font:900 18px/1 var(--font)}

  .msg.wait p i:nth-child(2){animation-delay:.15s}.msg.wait p i:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}

  .chips button{border:0;background:rgba(255,46,136,.1);color:var(--ink);padding:8px 12px;border-radius:999px;font:800 13px var(--font);cursor:pointer}
  .chat form{display:flex;gap:8px;padding:8px 14px 14px}
  .chat input{flex:1;min-width:0;border:0;border-radius:999px;padding:0 16px;height:44px;background:#fff;box-shadow:inset 0 0 0 2px rgba(27,29,36,.1);font:700 15px var(--font);color:var(--ink)}
  .chat input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--pink)}
  body.panel-open #stick,body.panel-open .tbtn,body.panel-open #talk-btn{display:none!important}
  @media (max-width:700px){.chat{max-height:70vh}.inside{top:auto;left:14px;right:14px;bottom:14px;width:auto;height:56vh}.bar{gap:8px}.pill{min-height:40px;padding:0 13px;font-size:14px}.hud{gap:10px}}
</style>

<body>
<canvas id="c" aria-label="Levagood Park in 3D" role="img"></canvas>
<div class="vig" aria-hidden="true"></div>
<div class="loading" id="loading">Mowing the park…</div>
<div class="bar">
  <a class="pill logo" href="index.html" aria-label="leva">leva<svg width="18" height="16" viewBox="0 0 64 56" aria-hidden="true"><path d="M32 54S2 36 2 18a14 14 0 0 1 30-6 14 14 0 0 1 30 6c0 18-30 36-30 36z" fill="#FF2E88"/></svg></a>
  <span class="pill hud" id="hud"><span><b>★</b><span id="hud-stars">0</span></span><span><b>◎</b><span id="hud-found">0</span> <i>found</i></span></span>
  <span class="spacer"></span>
  <button class="pill" id="look" aria-pressed="true" type="button">Look around</button>
  <button class="pill ink" id="walk" aria-pressed="false" type="button">Play</button>
  <button class="pill" id="who-btn" type="button" aria-haspopup="true" aria-expanded="false">You're leva ▾</button>
  <a class="pill" href="pool.html" id="look-btn">Pool map</a>
</div>
<div class="who" id="who" role="menu" aria-label="Play as"><b>Play as</b><button type="button" data-who="leva">leva</button><button type="button" data-who="em">Em</button><button type="button" data-who="mel">Mel</button><small>leva walks the park on his own when you're somebody else.</small></div>
<div class="hint" id="hint" role="status"></div>
<div class="talk" id="talk" role="status"><b id="talk-who"></b><span id="talk-txt"></span></div>
<div class="prompt" id="prompt"></div>
<div class="where" id="where"></div>
<div id="stick" aria-hidden="true"><i></i></div>
<button id="jump-btn" class="tbtn" type="button" aria-label="Jump">Jump</button>
<button id="run-btn" class="tbtn" type="button" aria-label="Run">Run</button>
<button id="talk-btn" class="pill ink" type="button">Talk</button>
<aside class="inside" id="inside" aria-label="Inside">
  <header><b id="inside-title">Inside Ari</b><button type="button" id="inside-x" aria-label="Close">✕</button></header>
  <div class="scroll" id="inside-body"></div>
</aside>
<section class="chat" id="chat" aria-label="Talk">
  <header><span class="who"><b id="chat-name"></b><i id="chat-mood"></i></span><span class="tools"><button type="button" id="chat-inside">Inside</button><button type="button" id="chat-x" aria-label="Close">✕</button></span></header>
  <div class="log" id="chat-log"></div>
  <div class="chips" id="chat-chips"></div>
  <form id="chat-form" autocomplete="off"><input id="chat-in" placeholder="Say something…" maxlength="160" autocomplete="off" enterkeyhint="send"><button class="pill ink" type="submit">Send</button></form>
</section>
<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-h">
  <div class="gate-card">
    <h2 id="gate-h">Sign in free to play</h2>
    <p>Looking around from above is open to everybody. Playing takes a free account, and it takes a minute: just your email.</p>
    <div class="gate-row"><a class="pill ink" id="gate-go" href="account.html">Sign in free</a><button class="pill" type="button" id="gate-x">Not now</button></div>
  </div>
</div>
